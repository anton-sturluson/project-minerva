[project]
name = "minerva-investor-platform"
version = "0.1.0"
description = "Local investor workspace API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "jsonschema>=4.26.0",
    "openpyxl==3.1.5",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.1",
    "uvicorn",
    "xlrd==2.0.2",
]

[project.scripts]
investor-economics = "investor_platform.economics.collection:main"
investor-financial = "investor_platform.financials.cli:main"
investor-api = "investor_platform.app:main"
investor-refresh-prices = "investor_platform.market_data.price_refresh:main"
investor-import = "investor_platform.ledger.import_transactions:main"
investor-reconcile-cash = "investor_platform.ledger.reconcile_cash:main"
investor-research-sync = "investor_platform.research.sync:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investor_platform"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "ANN", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "D"]
"migrations/**" = ["ANN", "D"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
