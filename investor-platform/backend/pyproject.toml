[project]
name = "minerva-investor-platform"
version = "0.1.0"
description = "Local investor workspace API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "fastapi",
    "psycopg[binary]>=3.3.6",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.1",
    "uvicorn",
]

[project.scripts]
investor-api = "investor_platform.app:main"
investor-import = "investor_platform.import_transactions:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/investor_platform"]

[dependency-groups]
dev = ["pytest", "httpx", "ruff"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
