name: Repository privacy

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: privacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check personal identifiers and private filenames
        run: python3 scripts/check_repo_privacy.py
      - name: Scan tracked files for secrets
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          tool_dir=$(mktemp -d)
          scan_dir=$(mktemp -d)
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          release="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl --fail --silent --show-error --location "$release/$archive" -o "$tool_dir/$archive"
          curl --fail --silent --show-error --location "$release/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o "$tool_dir/checksums.txt"
          (cd "$tool_dir" && grep "  $archive$" checksums.txt | sha256sum --check --strict)
          tar -xzf "$tool_dir/$archive" -C "$tool_dir" gitleaks
          git archive HEAD | tar -x -C "$scan_dir"
          "$tool_dir/gitleaks" dir "$scan_dir" --redact --no-banner
